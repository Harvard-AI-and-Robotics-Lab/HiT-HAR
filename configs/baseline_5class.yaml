# HiT-HAR Baseline 5-class: Standalone IMU pipeline, no distillation

lle:
  in_channels: 8
  embedding_dim: 128
  window_size: 50
  se_reduction: 8
  dropout: 0.2

hla:
  num_layers: 3
  num_classes: 8
  seq_len: 30
  nhead: 4
  dim_feedforward: 512
  dropout: 0.1

num_actions: 5

training:
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-5
  epochs: 30
  warmup_epochs: 5
  patience: 15
  grad_clip: 1.0
  beta_task: 0.7
  # Computed from gold+propagated training set (no #O, no LLM), effective number (beta=0.9999)
  # Order: Object Transfer, Task Operation, Stationary, Locomotion, Search
  action_weights: [1.0, 1.05, 1.15, 1.22, 1.85]
  # Scenario inv-freq from training set video counts
  # Order: Carpentry, Cleaning, Cooking, Desk Work, Gardening, Mechanical Repair, Playing Instrument, Walking Outdoors
  scenario_weights: [1.9, 1.0, 1.4, 2.0, 7.6, 1.2, 2.1, 1.6]

data:
  action_label_pad: 0.5
  per_video_center: true
  add_norm_features: true
  augmentation: true
  stride: 5
