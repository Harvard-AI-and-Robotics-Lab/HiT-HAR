# LLE-only baseline (EgoCHARM equivalent) — 4-class variant
# Minimal hierarchy: 1-layer HLA, no multi-scale, no language, no class-wise gate, no coarse head
# Purpose: establish LLE-only performance floor for ablation comparison (no Search class)
lle:
  in_channels: 8
  embedding_dim: 128
  window_size: 50
  se_reduction: 8
  dropout: 0.3
hla:
  num_layers: 1
  num_classes: 8
  seq_len: 30
  nhead: 4
  dim_feedforward: 512
  dropout: 0.2
num_actions: 4
exclude_actions: ['Search']
class_names: ['Object Transfer', 'Task Operation', 'Stationary', 'Locomotion']
class_wise_gate: false
coarse_head: false
language_distill: false
multiscale: false
dual_space: false
training:
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 5.0e-4
  epochs: 40
  warmup_epochs: 3
  patience: 15
  grad_clip: 1.0
  beta_task: 1.0
  label_smoothing: 0.05
  ema_decay: 0.999
  early_stop_metric: action_f1
  action_weights: [0.95, 1.05, 1.35, 1.10]
  scenario_weights: [1.9, 1.0, 1.4, 2.0, 7.6, 1.2, 2.1, 1.6]
data:
  action_label_pad: 0.25
  per_video_center: true
  add_norm_features: true
  augmentation: true
  stride: 10
